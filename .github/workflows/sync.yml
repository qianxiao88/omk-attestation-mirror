name: Sync attestation status

on:
  schedule:
    # Every 10 minutes. Upstream advertises cache-control: max-age=86400 and its
    # Last-Modified moves about once a day, so most runs are conditional hits
    # that finish in a couple of seconds and produce no commit.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the status list
        run: |
          set -euo pipefail
          url=https://android.googleapis.com/attestation/status
          # Reuse the stored validator so an unchanged list costs a 304 and no
          # body transfer. ETag is preferred; Last-Modified is the fallback.
          : > .headers
          if [ -f etag.txt ]; then
            curl -fsS --retry 3 --retry-delay 5 --max-time 60 -D .headers \
              -H "@etag.txt" "$url" -o status.json || true
          elif [ -f last-modified.txt ]; then
            curl -fsS --retry 3 --retry-delay 5 --max-time 60 -D .headers \
              -H "@last-modified.txt" "$url" -o status.json || true
          else
            curl -fsS --retry 3 --retry-delay 5 --max-time 60 -D .headers \
              "$url" -o status.json
          fi
          if grep -qiE '^HTTP/[0-9.]+ 304' .headers; then
            echo "not modified"
            rm -f status.json
            exit 0
          fi
          python3 - <<'PY'
          import json, sys
          with open('status.json', encoding='utf-8') as handle:
              data = json.load(handle)
          entries = data.get('entries')
          if not isinstance(entries, dict) or not entries:
              sys.exit('upstream did not return a status list')
          print(f"entries: {len(entries)}")
          PY
          # Keep the next run conditional on this exact revision.
          tr -d '\r' < .headers | grep -i '^etag:' | tail -1 | sed 's/^[Ee][Tt][Aa][Gg]: *//' \
            | sed 's/^/If-None-Match: /' > etag.txt || rm -f etag.txt
          tr -d '\r' < .headers | grep -i '^last-modified:' | tail -1 \
            | sed 's/^[Ll][Aa][Ss][Tt]-[Mm][Oo][Dd][Ii][Ff][Ii][Ee][Dd]: *//' \
            | sed 's/^/If-Modified-Since: /' > last-modified.txt || rm -f last-modified.txt
          rm -f .headers

      - name: Commit when the list changed
        run: |
          set -euo pipefail
          if [ ! -f status.json ]; then
            echo "unchanged"
            exit 0
          fi
          # `git diff --quiet -- path` reports "no change" for an untracked file,
          # so the first run would skip the commit and the mirror would stay
          # empty. Stage first, then ask about the index.
          git config user.name "sync"
          git config user.email "sync@users.noreply.github.com"
          git add status.json etag.txt last-modified.txt
          if git diff --cached --quiet; then
            echo "unchanged"
            exit 0
          fi
          git commit -m "Sync attestation status $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
