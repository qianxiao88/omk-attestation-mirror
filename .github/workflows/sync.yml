name: Sync attestation status

on:
  schedule:
    # Every 30 minutes. Upstream sends `cache-control: max-age=86400` and its
    # Last-Modified moves about once a day, so the conditional request below
    # turns most runs into a 304 with no body transfer and no commit.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the status list
        run: |
          set -euo pipefail
          url=https://android.googleapis.com/attestation/status
          rm -f status.json .headers

          # The endpoint has no ETag, so Last-Modified is the only validator.
          # Sending it back makes an unchanged list cost one round trip.
          validator=()
          if [ -f last-modified.txt ]; then
            validator=(-H "@last-modified.txt")
          fi

          code=$(curl -sS -o status.json -D .headers -w '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 60 "${validator[@]}" "$url")

          if [ "$code" = "304" ]; then
            echo "not modified"
            rm -f status.json
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "upstream returned HTTP $code"
            exit 1
          fi

          python3 - <<'PY'
          import json, sys
          with open('status.json', encoding='utf-8') as handle:
              data = json.load(handle)
          entries = data.get('entries')
          if not isinstance(entries, dict) or not entries:
              sys.exit('upstream did not return a status list')
          print(f"entries: {len(entries)}")
          PY

          # Remember this revision so the next run can ask for a 304.
          stamp=$(tr -d '\r' < .headers | grep -i '^last-modified:' | tail -1 \
            | sed 's/^[^:]*: *//')
          if [ -n "$stamp" ]; then
            printf 'If-Modified-Since: %s\n' "$stamp" > last-modified.txt
          else
            rm -f last-modified.txt
          fi
          rm -f .headers

      - name: Commit when the list changed
        run: |
          set -euo pipefail
          if [ ! -f status.json ]; then
            echo "unchanged"
            exit 0
          fi
          git config user.name "sync"
          git config user.email "sync@users.noreply.github.com"
          # `git diff --quiet -- path` reports "no change" for an untracked file,
          # and `git add <missing path>` aborts, so stage everything present and
          # then ask about the index instead of naming paths.
          git add -A .
          if git diff --cached --quiet; then
            echo "unchanged"
            exit 0
          fi
          git commit -m "Sync attestation status $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
